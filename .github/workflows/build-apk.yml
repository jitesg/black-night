name: Build Android APK

# Builds only on request: push a tag named build-<n> (or run it manually).
# Pushing code alone no longer builds an APK.
on:
  push:
    tags: ['build-*']
  workflow_dispatch:
    inputs:
      abis:
        description: 'CPU types (arm64-v8a = all phones from ~2017; add armeabi-v7a for very old 32-bit phones — slower build)'
        required: false
        default: 'arm64-v8a'

env:
  # faster build (owner): only the 64-bit CPU type by default — every phone of the last ~8 years
  ABIS: ${{ github.event.inputs.abis || 'arm64-v8a' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # caches Gradle downloads / build outputs between runs (faster builds)
      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
          ANDROID_VERSION_CODE: ${{ github.run_number }}

      # Reanimated links against libworklets.so but its task wiring doesn't
      # cover the newer buildCMake* tasks, so build worklets first.
      - name: Build worklets native library
        working-directory: android
        run: ./gradlew :react-native-worklets:mergeReleaseNativeLibs --no-daemon --build-cache -PreactNativeArchitectures=${{ env.ABIS }}
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g"

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --build-cache -PreactNativeArchitectures=${{ env.ABIS }}
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk InvestSuite.apk

      - uses: actions/upload-artifact@v4
        with:
          name: InvestSuite-apk
          path: InvestSuite.apk

      - name: Publish as GitHub release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: InvestSuite APK (build ${{ github.run_number }})
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: InvestSuite.apk
          body: Android APK built from ${{ github.sha }}. Download InvestSuite.apk below and open it on your phone to install.
